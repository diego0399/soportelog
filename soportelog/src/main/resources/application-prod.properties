# Perfil de PRODUCCION: PostgreSQL de Railway
# Usa las variables que expone el servicio Postgres de Railway (PGHOST, PGPORT, ...).
# Host, puerto, base y usuario tienen valor por defecto; la contrasena NO va en este
# archivo: se lee de la variable PGPASSWORD y la aplicacion no arranca si falta.
spring.datasource.url=jdbc:postgresql://${PGHOST:postgres.railway.internal}:${PGPORT:5432}/${PGDATABASE:railway}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD}

spring.datasource.hikari.maximum-pool-size=10

# En produccion Hibernate solo comprueba que el esquema coincide; no modifica tablas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Clave para firmar los JWT: obligatoria, se lee de la variable de entorno JWT_SECRET
jwt.secret=${JWT_SECRET}

# Dominios de la web que pueden llamar a la API (CORS), separados por comas, p. ej.
# https://app.soportelog.com. Si la variable no existe, ningun navegador puede
# llamarla (las apps de celular siguen funcionando: no usan CORS)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

logging.level.root=INFO
logging.level.com.soporte=INFO
