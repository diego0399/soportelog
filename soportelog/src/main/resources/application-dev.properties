# Perfil de DESARROLLO: PostgreSQL local en Docker (contenedor "postgres18")
#   docker run -d --name postgres18 -e POSTGRES_PASSWORD=1234 -e POSTGRES_USER=postgres -e POSTGRES_DB=soportelog -p 5432:5432 postgres:18
# Los valores despues de ":" son los que se usan si la variable de entorno no existe.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/soportelog}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

# Hibernate crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Clave para firmar los JWT (solo sirve para desarrollo)
jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-no-usar-en-produccion}

# Paginas web que pueden llamar a la API desde el navegador (CORS). En desarrollo,
# cualquier puerto de localhost: Flutter Web elige un puerto distinto en cada ejecucion
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

server.port=8080
server.error.include-message=always

logging.level.com.soporte=DEBUG
