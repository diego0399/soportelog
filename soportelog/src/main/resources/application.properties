# Configuracion comun a todos los perfiles
spring.application.name=soportelog

# Perfil que se usa cuando no se indica ninguno.
# Para cambiarlo: variable de entorno SPRING_PROFILES_ACTIVE=prod
# o argumento --spring.profiles.active=prod
spring.profiles.default=dev

spring.jpa.open-in-view=false

# Codigo OTP
# Minutos que dura un codigo
otp.expiration-minutes=5
# Intentos fallidos permitidos por codigo
otp.max-attempts=5
# Segundos de espera para pedir otro codigo
otp.resend-seconds=60

# Sesiones
# Minutos que dura el token de acceso (JWT). Es corto a proposito: el dispositivo
# lo renueva solo con su token de renovacion
jwt.access-minutes=15
# Dias sin usarse tras los cuales una sesion caduca y hay que volver a pedir codigo
session.inactivity-days=180

# Envio de correos por SMTP (por defecto Gmail). El usuario y la contrasena de
# aplicacion se leen de variables de entorno: nunca se escriben aqui.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Remitente que vera el usuario; si no se define, se usa la cuenta de Gmail
otp.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
